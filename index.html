<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1710">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VåpenWallet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" sizes="64x64" href="favicon-64.png" type="image/png">
<title>VåpenWallet</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#050a07;--bg2:#0a1710;--panel:#0c1912;--panel2:#101f17;
 --gold:#d6b36a;--gold2:#8d6b31;--text:#f7f3e7;--muted:#9fa89f;
 --green:#3ab96a;--line:rgba(214,179,106,.22);--danger:#d75d5d;
}
html,body{margin:0;min-height:100%;background:#020503;color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{padding-bottom:84px}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:auto;min-height:100vh;background:
radial-gradient(circle at 70% -8%,rgba(214,179,106,.12),transparent 28%),
linear-gradient(180deg,#09140e,#050a07 48%,#020503)}

.hero{position:relative;overflow:hidden;padding:calc(20px + env(safe-area-inset-top)) 18px 24px;
background:
linear-gradient(180deg,rgba(3,8,5,.18),rgba(4,10,7,.92) 78%),
linear-gradient(145deg,#314c38,#183120 52%,#08120c);
border-bottom:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset:0;opacity:.38;
background:
radial-gradient(circle at 78% 12%,rgba(255,231,171,.55),transparent 12%),
linear-gradient(150deg,transparent 36%,rgba(255,255,255,.06) 37% 38%,transparent 39%),
linear-gradient(25deg,transparent 56%,rgba(0,0,0,.26) 57% 59%,transparent 60%)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:86px;opacity:.9;
background:
radial-gradient(ellipse at 15% 110%,#0b1b11 0 46%,transparent 47%),
radial-gradient(ellipse at 40% 115%,#0a1710 0 52%,transparent 53%),
radial-gradient(ellipse at 70% 120%,#08130d 0 60%,transparent 61%)}

.brand{position:relative;z-index:2;display:flex;align-items:center;gap:13px}
.logo{width:72px;height:72px;border-radius:22px;overflow:hidden;border:1px solid rgba(214,179,106,.55);
box-shadow:0 14px 28px #0008;background:#0b140e}
.logo img{width:100%;height:100%;object-fit:cover}
.brand h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:1.78rem;letter-spacing:.035em;color:#f3dfac}
.brand p{margin:4px 0 0;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:#d5d9d2}

.hero-actions{position:relative;z-index:2;margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-actions button{min-height:48px;border-radius:15px;border:1px solid var(--line);
background:rgba(8,20,13,.84);color:#fff;font-weight:800}
.hero-actions .primary{background:linear-gradient(180deg,#d7b66e,#9b7735);color:#151006;border-color:#f2d28d}

.search{position:relative;z-index:2;margin-top:12px}
.search input{width:100%;padding:14px 15px;border-radius:16px;border:1px solid #ffffff16;
background:rgba(8,20,13,.86);color:#fff;outline:none}
.search input:focus{border-color:#d6b36a88;box-shadow:0 0 0 3px #d6b36a16}

.main{padding:18px 16px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.section-head h2{margin:0;font-size:1.35rem}
.small{font-size:.78rem;color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;min-height:142px;border-radius:19px;border:1px solid var(--line);overflow:hidden;
background:linear-gradient(160deg,#13251a,#0a1510);box-shadow:0 12px 26px #0005}
.tile .photo{height:88px;display:grid;place-items:center;font-size:2.5rem;
background:
radial-gradient(circle at 65% 20%,rgba(214,179,106,.18),transparent 26%),
linear-gradient(145deg,#1a3121,#0a1510)}
.tile .label{padding:12px 12px 13px;font-weight:850}
.tile .sub{font-size:.72rem;color:#aeb7af;font-weight:500;margin-top:2px}
.tile.gold{border-color:#d6b36a77}
.tile.gold .label{color:#f0d59b}

.cards{display:grid;gap:11px}
.weapon{display:grid;grid-template-columns:106px 1fr;border-radius:18px;overflow:hidden;border:1px solid rgba(214,179,106,.16);
background:linear-gradient(180deg,#101f16,#09140e);box-shadow:0 10px 22px #0004}
.weapon-img{min-height:118px;background:#0d1b12;display:grid;place-items:center;font-size:2.3rem;overflow:hidden}
.weapon-img img{width:100%;height:100%;object-fit:cover}
.weapon-info{padding:13px}
.weapon-info h3{margin:0 0 5px;font-size:1rem}
.meta{font-size:.8rem;line-height:1.5;color:#c5cec6}
.weapon-actions{display:flex;gap:7px;margin-top:8px}
.weapon-actions button{border:1px solid #ffffff12;border-radius:10px;background:#0a1510;color:#d8dfda;padding:7px 9px;font-size:.72rem}
.weapon-actions .fav{color:#e5c478}

.official{margin:16px 16px 0;width:calc(100% - 32px);padding:15px 16px;border-radius:17px;border:1px solid #e1c37b66;
background:linear-gradient(180deg,#cda957,#92702f);color:#161006;font-weight:900;box-shadow:0 12px 28px #0004}
.note{margin:8px 22px 20px;color:#879188;font-size:.73rem;line-height:1.45;text-align:center}

.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);height:78px;
padding:5px 8px calc(5px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);
background:rgba(3,8,5,.96);border-top:1px solid #ffffff10;backdrop-filter:blur(18px);z-index:40}
.nav{border:0;background:none;color:#8c978f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.63rem;font-weight:750}
.nav .ico{font-size:1.3rem}
.nav.active{color:var(--gold)}
.nav.plus .ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
background:linear-gradient(180deg,#d6b36a,#8d6b31);color:#171006;font-size:1.8rem}

dialog{width:min(94vw,500px);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:22px;
background:linear-gradient(180deg,#0f1f16,#08120c);color:#fff;padding:0}
dialog::backdrop{background:#000c;backdrop-filter:blur(4px)}
.modal{padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.modal-head h2{margin:0;font-size:1.3rem}
.close{background:none;border:0;color:#fff;font-size:1.6rem}
.field{margin-top:11px}
.field label{display:block;color:#b9c3bb;font-size:.8rem;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:12px;border-radius:12px;border:1px solid #2d3d31;background:#0b1710;color:#fff}
.row{display:flex;gap:9px}.row>*{flex:1}
.primary-btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:999px;background:linear-gradient(180deg,#d6b36a,#957231);font-weight:900;color:#161006}
.secondary-btn{width:100%;margin-top:9px;padding:12px;border-radius:999px;border:1px solid #36473a;background:#0b1710;color:#fff}
.danger{background:#2d1313;border-color:#613030;color:#ffdada}
.hidden{display:none!important}

.profile-card{padding:17px;border:1px solid var(--line);border-radius:18px;background:#0d1b12;margin-bottom:12px}
.profile-actions{display:grid;gap:9px}
.profile-actions button{padding:14px;border-radius:14px;border:1px solid #ffffff12;background:#0d1a12;color:#fff;text-align:left;font-weight:750}
</style>
</head>
<body>
<div class="app">
<section id="homeView">
<header class="hero">
  <div class="brand">
    <div class="logo"><img src="icon-192.png" alt=""></div>
    <div>
      <h1>VåpenWallet</h1>
      <p>For jegere i Norge</p>
    </div>
  </div>

  <div class="hero-actions">
    <button class="primary" id="officialTop">Digitalt våpenkort</button>
    <button id="quickAdd">+ Legg til våpen</button>
  </div>

  <div class="search"><input id="searchInput" type="search" placeholder="Søk i mine våpen …"></div>
</header>

<main class="main">
  <div class="section-head"><h2>Jaktoversikt</h2><span class="small">Lokalt på telefonen</span></div>
  <div class="grid">
    <button class="tile gold" id="tileWeapons"><div class="photo">🦌</div><div class="label">Mine våpen<div class="sub" id="weaponCount">0 våpen</div></div></button>
    <button class="tile" id="tileDocs"><div class="photo">📁</div><div class="label">Dokumenter<div class="sub">Egne notater og filer</div></div></button>
    <button class="tile" id="tileGear"><div class="photo">🎒</div><div class="label">Jaktutstyr<div class="sub">Personlig oversikt</div></div></button>
    <button class="tile" id="tileAreas"><div class="photo">📍</div><div class="label">Jaktområder<div class="sub">Notater og steder</div></div></button>
  </div>

  <div class="section-head" style="margin-top:22px"><h2>Mine våpen</h2><span class="small" id="countText"></span></div>
  <div id="weaponList" class="cards"></div>
</main>

<button id="officialBtn" class="official">Åpne offisielt digitalt våpenkort</button>
<p class="note">VåpenWallet er en privat jakt- og våpenoversikt. Offisielt våpenkort åpnes hos Politiet.</p>
</section>

<section id="profileView" class="hidden">
  <main class="main" style="padding-top:calc(24px + env(safe-area-inset-top))">
    <div class="section-head"><h2>Profil</h2><button id="backHome" class="secondary-btn" style="width:auto;margin:0;padding:8px 12px">Tilbake</button></div>
    <div class="profile-card"><b>VåpenWallet Jeger</b><p class="small">Lokal lagring på denne telefonen.</p></div>
    <div class="profile-actions">
      <button id="exportBtn">Lagre sikkerhetskopi</button>
      <button id="importBtn">Last inn sikkerhetskopi</button>
      <button id="clearBtn" class="danger">Slett alle lokale data</button>
    </div>
    <input id="importFile" type="file" accept=".json" hidden>
  </main>
</section>
</div>

<nav class="bottom">
  <button class="nav active" data-nav="home"><span class="ico">⌂</span><span>Hjem</span></button>
  <button class="nav" data-nav="weapons"><span class="ico">▣</span><span>Våpen</span></button>
  <button class="nav plus" id="navAdd"><span class="ico">＋</span></button>
  <button class="nav" data-nav="fav"><span class="ico">☆</span><span>Favoritter</span></button>
  <button class="nav" data-nav="profile"><span class="ico">◯</span><span>Profil</span></button>
</nav>

<dialog id="weaponDialog">
<div class="modal">
  <div class="modal-head"><h2 id="dialogTitle">Legg til våpen</h2><button class="close" id="closeDialog">×</button></div>
  <input id="editId" type="hidden">
  <div class="field"><label>Bilde</label><input id="photoInput" type="file" accept="image/*" capture="environment"></div>
  <div class="row">
    <div class="field"><label>Produsent</label><input id="makeInput" placeholder="Tikka"></div>
    <div class="field"><label>Modell</label><input id="modelInput" placeholder="T3x Lite"></div>
  </div>
  <div class="row">
    <div class="field"><label>Kaliber</label><input id="caliberInput" placeholder=".308 Win"></div>
    <div class="field"><label>Type</label><select id="typeInput"><option>Rifle</option><option>Hagle</option><option>Pistol</option><option>Revolver</option><option>Annet</option></select></div>
  </div>
  <div class="field"><label>Serienummer</label><input id="serialInput"></div>
  <div class="field"><label>Kjøpsdato</label><input id="dateInput" type="date"></div>
  <div class="field"><label>Notater</label><textarea id="notesInput" rows="3"></textarea></div>
  <button id="saveBtn" class="primary-btn">Lagre våpen</button>
  <button id="deleteBtn" class="secondary-btn danger hidden">Slett våpen</button>
</div>
</dialog>

<script>
const KEY='vapenwallet-jeger-v2';
let weapons=JSON.parse(localStorage.getItem(KEY)||'[]');
let filter='all', photoData='';

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function persist(){localStorage.setItem(KEY,JSON.stringify(weapons))}
function openOfficial(){window.open('https://www.politiet.no/tjenester/vapen/vapenkort/','_blank','noopener')}

function shown(){
 const q=$('searchInput').value.trim().toLowerCase();
 return weapons.filter(w=>{
   if(filter==='fav'&&!w.favorite)return false;
   return !q || [w.make,w.model,w.caliber,w.type,w.serial,w.notes].some(v=>String(v||'').toLowerCase().includes(q));
 });
}
function render(){
 const arr=shown();
 $('weaponCount').textContent=`${weapons.length} våpen`;
 $('countText').textContent=`${arr.length} vist`;
 $('weaponList').innerHTML=arr.length?arr.map(w=>`
 <article class="weapon">
   <div class="weapon-img">${w.photo?`<img src="${w.photo}" alt="">`:'🌲'}</div>
   <div class="weapon-info">
      <h3>${esc([w.make,w.model].filter(Boolean).join(' ')||'Uten navn')}</h3>
      <div class="meta">
      ${w.caliber?`Kaliber: ${esc(w.caliber)}<br>`:''}
      ${w.type?`Type: ${esc(w.type)}<br>`:''}
      ${w.serial?`Serienr.: ${esc(w.serial)}`:''}
      </div>
      <div class="weapon-actions">
        <button data-edit="${w.id}">Rediger</button>
        <button class="fav" data-fav="${w.id}">${w.favorite?'★ Favoritt':'☆ Favoritt'}</button>
      </div>
   </div>
 </article>`).join(''):'<div class="profile-card"><b>Ingen våpen lagt til ennå.</b><p class="small">Trykk på + for å legge til det første.</p></div>';
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));
 document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const w=weapons.find(x=>x.id===b.dataset.fav);if(w){w.favorite=!w.favorite;persist();render()}});
}
function resetForm(){
 $('editId').value='';$('dialogTitle').textContent='Legg til våpen';
 ['makeInput','modelInput','caliberInput','serialInput','dateInput','notesInput'].forEach(id=>$(id).value='');
 $('typeInput').value='Rifle';$('photoInput').value='';photoData='';$('deleteBtn').classList.add('hidden');
}
function openAdd(){resetForm();$('weaponDialog').showModal()}
function openEdit(id){
 const w=weapons.find(x=>x.id===id);if(!w)return;
 $('editId').value=id;$('dialogTitle').textContent='Rediger våpen';
 $('makeInput').value=w.make||'';$('modelInput').value=w.model||'';$('caliberInput').value=w.caliber||'';
 $('typeInput').value=w.type||'Rifle';$('serialInput').value=w.serial||'';$('dateInput').value=w.date||'';
 $('notesInput').value=w.notes||'';photoData=w.photo||'';$('deleteBtn').classList.remove('hidden');$('weaponDialog').showModal();
}
$('photoInput').onchange=e=>{
 const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>photoData=r.result;r.readAsDataURL(f);
};
$('saveBtn').onclick=()=>{
 const id=$('editId').value||crypto.randomUUID(), old=weapons.find(x=>x.id===id);
 const obj={id,make:$('makeInput').value.trim(),model:$('modelInput').value.trim(),
 caliber:$('caliberInput').value.trim(),type:$('typeInput').value,serial:$('serialInput').value.trim(),
 date:$('dateInput').value,notes:$('notesInput').value.trim(),photo:photoData,favorite:old?.favorite||false};
 if(old)Object.assign(old,obj);else weapons.unshift(obj);
 persist();$('weaponDialog').close();render();
};
$('deleteBtn').onclick=()=>{
 const id=$('editId').value;if(id&&confirm('Slette dette våpenet fra VåpenWallet?')){
  weapons=weapons.filter(w=>w.id!==id);persist();$('weaponDialog').close();render();
 }
};
$('closeDialog').onclick=()=>$('weaponDialog').close();
$('quickAdd').onclick=openAdd;$('navAdd').onclick=openAdd;
$('officialBtn').onclick=openOfficial;$('officialTop').onclick=openOfficial;
$('searchInput').oninput=render;

function showHome(){ $('homeView').classList.remove('hidden');$('profileView').classList.add('hidden'); }
function showProfile(){ $('homeView').classList.add('hidden');$('profileView').classList.remove('hidden'); }
$('backHome').onclick=showHome;
$('tileWeapons').onclick=()=>{filter='all';render();document.querySelector('.section-head:nth-of-type(2)')?.scrollIntoView({behavior:'smooth'})};
['tileDocs','tileGear','tileAreas'].forEach(id=>$(id).onclick=()=>alert('Kommer i neste versjon.'));
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));b.classList.add('active');
 const n=b.dataset.nav;
 if(n==='profile')showProfile();
 else{showHome();filter=n==='fav'?'fav':'all';render();}
});
$('exportBtn').onclick=()=>{
 const blob=new Blob([JSON.stringify(weapons,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vapenwallet-jeger-backup.json';a.click();URL.revokeObjectURL(a.href);
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{
 const f=e.target.files?.[0];if(!f)return;
 try{const d=JSON.parse(await f.text());if(Array.isArray(d)){weapons=d;persist();render();alert('Backup lastet inn.')}}catch{alert('Kunne ikke lese filen.')}
};
$('clearBtn').onclick=()=>{if(confirm('Slette alle lokale data?')){weapons=[];persist();render();}};
render();
</script>
</body>
</html>
